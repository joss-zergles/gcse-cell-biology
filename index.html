<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell Biology FC</title>
  <meta name="description" content="AQA GCSE Biology cell biology revision with football animations and spaced-repetition flashcards.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">⚽ <span>Cell Biology FC</span></a>
    <div class="scoreboard" id="scoreboard"></div>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">AQA GCSE Biology 8461 · 4.1 Cell biology · progress is saved on this device</footer>

  <dialog id="settings">
    <form method="dialog" class="settings-body">
      <h2>Kit room ⚙️</h2>
      <label class="row"><input type="checkbox" id="unlockAll"> Unlock every section (skip the mastery gate)</label>
      <h3>Move progress to another device</h3>
      <p class="muted">Copy this code on one device and paste it on the other.</p>
      <textarea id="progressCode" rows="3" spellcheck="false"></textarea>
      <div class="row gap">
        <button type="button" class="btn small" id="copyCode">Copy code</button>
        <button type="button" class="btn small" id="loadCode">Load pasted code</button>
      </div>
      <h3>Start the season again</h3>
      <button type="button" class="btn small danger" id="resetAll">Reset all progress</button>
      <div class="row end"><button class="btn">Done</button></div>
    </form>
  </dialog>

  <script>
    window.CELLBIO_SECTIONS = [];
    function registerSection(s) { window.CELLBIO_SECTIONS.push(s); }
  </script>
  <script src="content/4.1.1.1.js?v=3"></script>
  <script src="content/4.1.1.2.js?v=3"></script>
  <script src="content/4.1.1.3.js?v=3"></script>
  <script src="content/4.1.1.4.js?v=3"></script>
  <script src="content/4.1.1.5.js?v=3"></script>
  <script src="content/4.1.1.6.js?v=3"></script>
  <script src="content/4.1.2.1.js?v=3"></script>
  <script src="content/4.1.2.2.js?v=3"></script>
  <script src="content/4.1.2.3.js?v=3"></script>
  <script src="content/4.1.3.1.js?v=3"></script>
  <script src="content/4.1.3.2.js?v=3"></script>
  <script src="content/4.1.3.3.js?v=3"></script>
  <script src="js/scenes.js?v=3"></script>
  <script src="js/srs.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
